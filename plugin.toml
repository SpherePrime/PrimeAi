[plugin]
id = "dwertyfa-prime-ai"
name = "PrimeAI"
version = "0.2.15"
description = "AI chat, web search, and image and video generation. Automatic model routing, manual model selection, and connection checks in the plugin settings."
author = "dwertyfa x Lil KALINOV"
license = "MIT"
icon = "icon.svg"

[entry]
command = "node"
args = ["dist/index.js"]
runtimes = ["node"]

[capabilities]
ai_provider = true
tools = true
ui_contributions = true
